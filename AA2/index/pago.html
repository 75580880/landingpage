<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mew Shop - Finalizar Compra</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <div id="header-container"></div>

  <header class="ropa-clasica">
    <h1>Datos de Envío y Pago 🐾</h1>
  </header>

  <main class="contenedor-galeria-1">
    <!-- TARJETA 1: FORMULARIO DE PAGO -->
    <article id="seccion-formulario" class="tarjeta-producto">
      <h2 class="titulo-producto">Resumen de tu Pedido</h2>
      <p id="resumen-cantidad">Productos: 0</p>
      <p id="total-resumen" class="precio-producto">Total a pagar: S/0.00</p>

      <form id="form-pago">
        <p><label for="nombre-cliente"><strong>Nombre completo:</strong></label></p>
        <input type="text" id="nombre-cliente" placeholder="Ej. Ana Torres" required>

        <p><label for="telefono-cliente"><strong>Teléfono / WhatsApp:</strong></label></p>
        <input type="tel" id="telefono-cliente" placeholder="Ej. 987 654 321" required>

        <p><label for="distrito-cliente"><strong>Distrito (Lima):</strong></label></p>
        <input type="text" id="distrito-cliente" placeholder="Ej. Miraflores, Surco, San Borja..." required>

        <p><label for="direccion-cliente"><strong>Dirección exacta:</strong></label></p>
        <input type="text" id="direccion-cliente" placeholder="Av. / Calle / N° / Referencia" required>

        <p><label for="metodo-pago"><strong>Forma de pago:</strong></label></p>
        <select id="metodo-pago" required>
          <option value="">Selecciona un método de pago</option>
          <option value="Yape / Plin">Yape / Plin</option>
          <option value="Tarjeta de Crédito o Débito">Tarjeta de Crédito o Débito</option>
          <option value="Pago Contra Entrega">Pago Contra Entrega (Efectivo)</option>
        </select>

        <nav class="boton-comprar">
          <button type="submit" class="btn">Finalizar Compra</button>
        </nav>
      </form>
    </article>

    <!-- TARJETA 2: CUADRO DE GRACIAS Y RESUMEN (Oculto al inicio) -->
    <article id="confirmacion-compra" class="tarjeta-producto" style="display: none;">
      <div class="contenedor-foto-producto">
        <!-- CAMBIA ESTA URL POR LA IMAGEN DE GATO QUE QUIERAS -->
        <img id="imagen-gracias-gato" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSERFtAbYchmJuD1q2OIJLSHxIP7UET71uerTvovcPjMA&s=10" alt="Gatito agradeciendo tu compra">
      </div>
      <h2 class="titulo-producto">¡Gracias por su compra! 🐾</h2>
      <div id="detalle-resumen-compra"></div>

      <nav class="boton-comprar">
        <a href="inicio.html" class="btn">Ir al inicio</a>
      </nav>
    </article>
  </main>

  <div id="footer-container"></div>

  <script src="../compoonentes/componentes.js"></script>
</body>
</html>
